<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>City Main V5 · 实际地图预览</title><style>html,body{margin:0;overflow:hidden;background:#96ad99;color:white;font:13px system-ui}canvas{display:block}header{position:absolute;top:12px;left:12px;right:12px;border-radius:7px;background:#142e37ed;padding:12px}h1{font-size:18px;margin:0 0 6px}p{margin:0;color:#d3dfdc}nav{position:absolute;bottom:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:5px}button{background:#173840ed;border:1px solid #87aaa2;color:white;border-radius:5px;padding:9px 12px;cursor:pointer}button[aria-pressed=true]{background:#48776d}footer{position:absolute;bottom:108px;left:12px;background:#142e37dc;padding:6px;border-radius:4px;font-size:11px}</style><body><header><h1>City Main V5 · 实际地图预览</h1><p id="description">沿用六座系统互通 · 普通城市街区 · 自动导向牌 · 共享道路边缘</p><button id="load">加载实际地图</button></header><nav><button data-view="overview">全城</button><button data-view="central">中央城区</button><button data-view="west">西城</button><button data-view="east">东城</button><button data-view="expressway">快速路分叉路牌</button><button data-view="urban">城市分叉路牌</button><button data-view="barrier">高架护栏</button><button data-view="junction">复杂路口</button></nav><footer>实际 CityGround / RoadSignRenderer · 俯视与驾驶视角</footer>
<script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';import {CityGround} from '/src/world/city/CityGround.ts';
const load=document.querySelector('#load');await new Promise(resolve=>load.onclick=()=>{load.disabled=true;load.textContent='正在加载…';setTimeout(resolve,0);});
const data=await(await fetch('/artifacts/city-main-v5/candidate.json')).json();if(data.environment.metadata.urbanSkeletonVersion!=='5')throw new Error('需要 V5 地图');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x96ad99);scene.add(new THREE.HemisphereLight(0xddeeff,0x76705f,2.3));const sun=new THREE.DirectionalLight(0xfff3dd,3);sun.position.set(-180,350,100);scene.add(sun);const ground=new CityGround(data,{editor:true});scene.add(ground.root);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
const ortho=new THREE.OrthographicCamera(-150,150,150,-150,1,20000);ortho.up.set(0,0,-1);const perspective=new THREE.PerspectiveCamera(55,1,.2,20000);
const roadById=new Map(data.roads.map(r=>[r.id,r]));
const express=data.signs.find(s=>s.type==='EXPRESSWAY_DIVERGE'&&s.template==='gantry'&&roadById.get(s.roadId).type==='highway'&&roadById.get(s.roadId).laneCount>=3&&(s.position.y??0)>5&&s.destinations.some(d=>d.arrow==='exit-right')&&roadById.get(s.roadId).groupId!=='peripheral-interchange');
const urban=data.signs.find(s=>s.type==='URBAN_DIRECTION'&&roadById.get(s.roadId).roadNameId==='central-avenue'&&s.destinations.some(d=>d.roadNameId==='new-city-avenue'))??data.signs.find(s=>s.type==='URBAN_DIRECTION'&&roadById.get(s.roadId).roadNameId==='central-avenue');
const irregular=data.intersections.find(j=>j.type==='irregular'&&j.connections.some(c=>c.roadId.startsWith('v5-')));
const views={overview:[450,0,6000,'全城 · 六座互通与普通街区'],central:[-70,180,1550,'中央城区 · 市府大道 / 中央大道 / 斜向新城大道'],west:[-1260,140,1250,'西城 · 错位小街和 T 形连接'],east:[1270,80,1550,'东城 · 大街坊 / 东城大道 / 主辅路'],expressway:[0,0,0,'快速路分叉 · 从道路图自动生成预告与分流牌'],urban:[0,0,0,'城市分叉 · 元数据道路名称与实际转向'],barrier:[500,-1400,190,'高架边缘 · 接缝共享 / 桥面高度锚定'],junction:[irregular?.position.x??-460,irregular?.position.z??150,210,'复杂路口 · 统一路面 / 路缘与附属物开口']};
let view='overview',exporting=false;function render(){const[x,z,width,label]=views[view],aspect=exporting?1:innerWidth/innerHeight;let camera=ortho;
if(view==='expressway'||view==='urban'){const s=view==='expressway'?express:urban,t={x:-Math.sin(s.heading),z:-Math.cos(s.heading)},y=s.position.y??0,dist=view==='expressway'?65:38;perspective.aspect=aspect;perspective.position.set(s.position.x-t.x*dist,y+5,s.position.z-t.z*dist);perspective.lookAt(s.position.x+t.x*25,y+4,s.position.z+t.z*25);perspective.updateProjectionMatrix();camera=perspective;}
else if(view==='barrier'){perspective.aspect=aspect;perspective.position.set(x-50,31,z+70);perspective.lookAt(x+30,8,z);perspective.updateProjectionMatrix();camera=perspective;}
else{const span=width/Math.min(aspect,1);ortho.left=-span*aspect/2;ortho.right=span*aspect/2;ortho.top=span/2;ortho.bottom=-span/2;ortho.position.set(x,7000,z);ortho.lookAt(x,0,z);ortho.updateProjectionMatrix();}
renderer.setSize(exporting?1800:innerWidth,exporting?1800:innerHeight,false);renderer.domElement.style.width=innerWidth+'px';renderer.domElement.style.height=innerHeight+'px';renderer.render(scene,camera);document.querySelector('h1').textContent='City Main V5 · '+label;document.querySelector('#description').textContent=`${data.roads.length} 道路段 · ${data.intersections.length} 路口 · ${data.signs.length} 自动路牌 · 系统互通冻结`;for(const b of document.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String(b.dataset.view===view));document.body.dataset.ready='true';}
const exportButton=document.createElement('button');exportButton.textContent='生成当前预览 PNG';document.querySelector('nav').append(exportButton);const download=document.createElement('a');download.id='export-image';download.style.color='#ffffff';download.style.padding='9px';document.querySelector('nav').append(download);exportButton.onclick=()=>{exporting=true;render();const c=document.createElement('canvas');c.width=1800;c.height=2000;const ctx=c.getContext('2d');ctx.fillStyle='#142e37';ctx.fillRect(0,0,1800,2000);ctx.drawImage(renderer.domElement,0,135,1800,1800);ctx.fillStyle='white';ctx.font='bold 38px system-ui';ctx.fillText('City Main V5 · '+views[view][3],35,55);ctx.font='28px system-ui';ctx.fillText(document.querySelector('#description').textContent,35,103);ctx.font='24px system-ui';ctx.fillText('实际 CityGround / RoadSignRenderer · '+view,35,1975);download.href=c.toDataURL('image/png');download.download=view+'.png';download.textContent='下载当前预览 PNG';exporting=false;render();};
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{view=b.dataset.view;render();};addEventListener('resize',render);load.remove();render();
</script></body></html>
