<!doctype html><meta charset="utf-8"><title>Golf GTI · OEM reference refinement</title>
<style>body{margin:0;background:#777;font:13px system-ui;color:#eee}canvas{display:block}nav{position:absolute;top:10px;left:10px;display:flex;gap:5px;flex-wrap:wrap;right:10px}button{background:#222;color:#eee;border:1px solid #666;padding:8px;border-radius:4px;cursor:pointer}button.active{border-color:#da4455}pre{position:absolute;bottom:10px;left:10px;background:#111c;padding:8px;pointer-events:none;margin:0}#dial{display:none;position:absolute;top:90px;left:0;width:100%}</style>
<nav id="views"><button data-view="normal">DriverEye</button><button data-view="cluster">Instrument close</button><button data-view="overview">Cabin overview</button><button data-view="oblique">Side oblique</button><button data-view="console">Console</button><button data-view="front">Front ¾</button><button data-view="rear">Rear ¾</button><button id="door">Door</button><button id="window">Window</button><button id="lamps">Lights</button><button id="theme">Day/night</button><button id="view">VIEW</button><button id="export-dial">Dial pixels</button></nav>
<pre id="stats">Loading…</pre><img id="render-export" hidden alt="Original rendered WebGL frame"><img id="dial" alt="Original instrument canvas pixels">
<script type="module">
import * as T from 'three';
import {VehicleVisual} from '/src/vehicle/visual/VehicleVisual.ts';
import {VehicleAssetRegistry} from '/src/vehicle/visual/VehicleAssetRegistry.ts';
import {VehicleLighting} from '/src/vehicle/visual/VehicleLighting.ts';
import {VehicleInteractionController} from '/src/vehicle/interaction/VehicleInteractionController.ts';
import {applyVehicleInteractionVisual} from '/src/vehicle/interaction/VehicleInteractionDefinition.ts';
import {GOLF_GTI_VISUAL_CONFIG as config} from '/src/vehicle/visual/golfGTIVisualConfig.ts';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.localClippingEnabled=true;
renderer.toneMapping=T.ACESFilmicToneMapping;document.body.prepend(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#aab5bd');
const hemi=new T.HemisphereLight(0xd9edf2,0x59644f,2.1);hemi.layers.enableAll();scene.add(hemi);
const sun=new T.DirectionalLight(0xfff1dc,3);sun.position.set(-3,7,-4);sun.layers.enableAll();scene.add(sun);
const assets=new VehicleAssetRegistry();VehicleVisual.prepareAssets(config,assets);const car=new VehicleVisual(config,assets);scene.add(car.root);
const lighting=new VehicleLighting(car),access=new VehicleInteractionController();access.configure(car.interactionDefinition);
const telemetry={ignitionOn:true,engineRunning:true,speedKmh:0,rpm:820,gear:'P',driveMode:'NORMAL',fuelLevel:.7,coolantTemperatureC:88,outsideTemperatureC:21,ambientDaylight:1,indicators:{parkingBrake:true},trip:{totalDistanceKm:68.3,tripA:{distanceKm:12.4,operatingTimeSeconds:1740,movingTimeSeconds:1300,fuelUsedL:.98,averageSpeedKmh:25.65,averageFuelConsumptionLPer100km:7.9}}};
const camera=new T.PerspectiveCamera(62,innerWidth/innerHeight,.015,100);camera.layers.enableAll();
const views={normal:{eye:config.driverEyePosition,target:[-.37,1.19,-1],fov:62},cluster:{eye:[-.37,1.03,-.02],target:[-.37,.991,-.58],fov:43},overview:{eye:[0,1.31,.80],target:[0,.65,-.29],fov:69},oblique:{eye:[-.71,1.15,.35],target:[.20,.78,-.49],fov:67},console:{eye:[.16,1.07,.44],target:[.08,.49,.015],fov:57},front:{eye:[-4,2.05,-5.4],target:[0,.66,0],fov:42},rear:{eye:[3.8,1.9,5.5],target:[0,.66,0],fov:42}};
let view='normal',open=false,windowOpen=0,night=false,on=false;
function render(){
const v=views[view];camera.position.set(...v.eye);camera.lookAt(...v.target);camera.fov=v.fov;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
telemetry.driverAccess={doorOpen:open?1:0,windowOpen};car.updateInstruments(telemetry,1);applyVehicleInteractionVisual(car.interactionDefinition,open?1:0,windowOpen);car.root.updateMatrixWorld(true);renderer.render(scene,camera);
document.querySelector('#render-export').src=renderer.domElement.toDataURL('image/png');document.querySelector('#dial').src=car.root.getObjectByName('GTI twin circular digital instruments').canvas.toDataURL('image/png');
let meshes=0,vertices=0;const mats=new Set(),textures=new Set();car.root.traverse(o=>{if(!o.isMesh)return;meshes++;vertices+=o.geometry.getAttribute('position').count;for(const m of Array.isArray(o.material)?o.material:[o.material]){mats.add(m);Object.values(m).forEach(t=>{if(t?.isTexture)textures.add(t)})}});
document.querySelector('#stats').textContent=JSON.stringify({view,eye:v.eye,doorOpen:open,windowOpen,night,meshes,materials:mats.size,textures:textures.size,vertices,renderCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles},null,1);
document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
document.querySelector('#door').onclick=()=>{open=!open;render()};document.querySelector('#window').onclick=()=>{windowOpen=(windowOpen+.5)%1.5;render()};
document.querySelector('#lamps').onclick=()=>{on=!on;lighting.setMode(on?'low':'off');render()};
document.querySelector('#theme').onclick=()=>{night=!night;telemetry.ambientDaylight=night?.015:1;hemi.intensity=night?.07:2.1;sun.intensity=night?0:3;scene.background.set(night?'#080b12':'#aab5bd');render()};
document.querySelector('#view').onclick=()=>{car.root.getObjectByName('GTI twin circular digital instruments').cycleView();render()};
document.querySelector('#export-dial').onclick=()=>{const img=document.querySelector('#dial');img.style.display=img.style.display==='block'?'none':'block'};
renderer.domElement.onclick=e=>{const ray=new T.Raycaster();ray.layers.enableAll();ray.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2),camera);car.cockpitRoot.handleDisplayClick(ray);render()};
addEventListener('resize',render);render();
</script>
