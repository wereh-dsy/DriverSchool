<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Vehicle selection integration test</title>
<link rel="stylesheet" href="/src/styles.css"><link rel="stylesheet" href="/src/ui/design/system.css"><div id="app"></div>
<script type="module">
import {StartupApplication} from '/src/game/startup/StartupApplication.ts';
const app=new StartupApplication(document.querySelector('#app'));
const assert=(ok,message)=>{if(!ok)throw Error(message)};
const wait=async(test,limit=60000)=>{const start=performance.now();while(!test()){if(performance.now()-start>limit)throw Error('Selection/drive timeout: '+app.ui.state.loading.message);if(app.ui.state.loading.phase==='error')throw Error(app.ui.state.loading.message);await new Promise(r=>setTimeout(r,30));}};
const painted=async()=>{for(let i=0;i<4;i++)await new Promise(requestAnimationFrame);};
window.runSelectionSmoke=async()=>{
  await wait(()=>performance.getEntriesByName('loading:menuSceneReady').length>0);
  app.ui.navigate('vehicles');
  const picker=document.querySelector('[data-vehicle-picker]'),options=[...picker.options];
  assert(options.some(o=>o.value==='tank-500-hi4-t'),'Tank is missing from actual startup selection options');
  const before=performance.getEntriesByName('loading:vehicleReady').length;
  picker.value='tank-500-hi4-t';picker.dispatchEvent(new Event('change',{bubbles:true}));
  assert(app.ui.state.vehicleId==='tank-500-hi4-t','Picker does not reach startup selection');
  assert(document.querySelector('[data-vehicle-name]').textContent.includes('Tank 500'),'Selected name does not display Tank');
  assert(document.querySelector('[data-vehicle-spec]').textContent.includes('P2'),'Selected Tank card does not show the hybrid powertrain');
  await wait(()=>performance.getEntriesByName('loading:vehicleReady').length>before&&app.menu?.owner?.body.design==='tank-500'&&app.menu.visual?.getObjectByName('Tank tailgate external spare tyre'));
  await painted();
  return {options:options.length,tankVisible:true,selected:app.ui.state.vehicleId,menuModel:'tank-500',heading:document.querySelector('[data-vehicle-name]').textContent,spec:document.querySelector('[data-vehicle-spec]').textContent};
};
window.runDriveSmoke=async()=>{
  app.ui.startDrive();await wait(()=>app.ui.state.screen==='driving',90000);
  await wait(()=>[...document.querySelectorAll('summary')].some(s=>s.textContent.includes('Hi4-T')&&!s.parentElement.hidden));
  await wait(()=>document.querySelector('[data-screen="loading"]').hidden&&app.game?.vehicleVisual?.root.getObjectByName('Tank tailgate external spare tyre'));
  await painted();
  return {selected:app.ui.state.vehicleId,screen:app.ui.state.screen,hybridPanelVisible:true,driveModel:'tank-500',loading:app.ui.state.loading.phase};
};
window.addEventListener('beforeunload',()=>app.dispose());
</script></html>
