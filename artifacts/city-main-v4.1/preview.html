<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>City Main V4.1 · 定向预览</title><style>
html,body{margin:0;overflow:hidden;background:#96ad99;color:white;font:13px system-ui}canvas{display:block}header{position:absolute;top:12px;left:12px;right:12px;border-radius:7px;background:#142e37ed;padding:12px}h1{font-size:18px;margin:0 0 6px}p{margin:0;color:#d3dfdc}nav{position:absolute;bottom:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:5px}button{background:#173840ed;border:1px solid #87aaa2;color:white;border-radius:5px;padding:9px 12px;cursor:pointer}button[aria-pressed=true]{background:#48776d}footer{position:absolute;bottom:62px;left:12px;background:#142e37dc;padding:6px;border-radius:4px;font-size:11px}
</style></head><body><header><h1>City Main V4.1 · 实际地图预览</h1><p id="description">统一路口路面 · 紧凑普通接入 · 六座系统互通冻结</p><button id="load">加载实际地图</button></header><nav><button data-view="wide">宽路 × 窄路</button><button data-view="angled">斜交路口</button><button data-view="T">T 形路口</button><button data-view="access">普通直连接入</button><button data-view="diamond">紧凑菱形接入</button><button data-view="logical">Tesla / minimap 逻辑图</button></nav><footer>北向上 · 3D 使用实际 CityGround · 逻辑图使用游戏共有地图层</footer>
<script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import {CityGround} from '/src/world/city/CityGround.ts';import {LocalRoadMap} from '/src/ui/LocalRoadMap.ts';
const load=document.querySelector('#load');await new Promise(resolve=>load.onclick=()=>{load.disabled=true;load.textContent='正在加载…';setTimeout(resolve,0);});
const data=await(await fetch('/city-main.json')).json();if(data.environment.metadata.junctionGeometryVersion!=='4.1')throw new Error('尚未发布 V4.1');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x96ad99);scene.add(new THREE.HemisphereLight(0xddeeff,0x76705f,2.3));const sun=new THREE.DirectionalLight(0xfff3dd,3);sun.position.set(-180,350,100);scene.add(sun);
const ground=new CityGround(data,{editor:true});scene.add(ground.root);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
const canvas=document.createElement('canvas');canvas.style.display='none';document.body.prepend(canvas);const local=new LocalRoadMap();local.setNetwork(ground.roadNetwork);
const camera=new THREE.OrthographicCamera(-150,150,150,-150,1,20000);camera.up.set(0,0,-1);
const views={wide:[-1450,350,190,'宽窄路口 · 中央大道西端 · 统一动态边界'],angled:[-281,686.5,220,'斜交路口 · 新城大道 × 内环大道'],T:[-621.3,-820,180,'T 形路口 · 北城大道 · 终止道路正确接入'],access:[900,-1400,500,'北环辅路直连区 · 同向上匝道 / 下匝道'],diamond:[-875,-150,400,'西侧紧凑菱形 · 匝道中心线范围 220 × 120 m'],logical:[-281,686.5,220,'Tesla / minimap 共有逻辑层 · 同一斜交路口']};
let view='wide';function render(){const [x,z,width,label]=views[view],aspect=innerWidth/innerHeight,span=width/Math.min(aspect,1);camera.left=-span*aspect/2;camera.right=span*aspect/2;camera.top=span/2;camera.bottom=-span/2;camera.position.set(x,7000,z);camera.lookAt(x,0,z);camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.render(scene,camera);canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';const logical=view==='logical';if(logical)local.draw(canvas.getContext('2d'),{x:0,y:0,width:canvas.width,height:canvas.height},x,z,0,span*aspect);renderer.domElement.style.display=logical?'none':'block';canvas.style.display=logical?'block':'none';document.querySelector('h1').textContent='City Main V4.1 · '+label;document.querySelector('#description').textContent='500 道路段 · 84 统一路口 · 6 条上匝道 + 6 条下匝道 · 2 处紧凑菱形';for(const b of document.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String(b.dataset.view===view));document.body.dataset.ready='true';}
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{view=b.dataset.view;render();};addEventListener('resize',render);load.remove();render();
</script></body></html>
